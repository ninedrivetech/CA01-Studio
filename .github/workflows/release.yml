name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve release source
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Resolve immutable commit
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Test and build (${{ matrix.platform }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            bundles: nsis
          - platform: linux
            runner: ubuntu-22.04
            bundles: deb,appimage
          - platform: macos
            runner: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Configure Windows Git line endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libfuse2 webkit2gtk-driver xvfb dbus-x11
      - run: npm ci
      - name: Verify version and source tag
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); const t=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")); if(process.env.RELEASE_TAG!==`v${p.version}` || t.version!==p.version) throw Error("Release tag and package versions must agree");'
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Install browser
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build installers
        shell: bash
        run: |
          echo "Source state before build:"
          git status --porcelain
          if node scripts/build-desktop.mjs --bundles ${{ matrix.bundles }} --ci; then
            exit 0
          else
            build_status=$?
            echo "Source state after failed build:"
            git status --porcelain
            git diff --stat
            git diff -- src-tauri/Cargo.toml
            exit "$build_status"
          fi
      - name: Windows packaged app smoke test
        if: runner.os == 'Windows'
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          $probeFile = Join-Path $env:RUNNER_TEMP 'cicada-native-probe.ps1'
          $probeOutput = Join-Path $env:GITHUB_WORKSPACE 'test-results/native-startup-diagnostics.json'
          $probeSource = @'
          param([string]$OutputPath)
          Start-Sleep -Seconds 5
          $apps = @(Get-CimInstance Win32_Process -Filter "Name='zhiliao-studio.exe'")
          $profile = Join-Path $env:GITHUB_WORKSPACE 'test-results\native-profile'
          $webviews = @(Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" |
            Where-Object { $_.CommandLine -and $_.CommandLine.IndexOf($profile,[StringComparison]::OrdinalIgnoreCase) -ge 0 })
          $browserIds = @($webviews | ForEach-Object ProcessId)
          $listeners = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.OwningProcess -in $browserIds } |
            Select-Object LocalAddress,LocalPort,OwningProcess)
          $policies = @()
          foreach ($key in @('HKLM:\SOFTWARE\Policies\Microsoft\Edge','HKCU:\SOFTWARE\Policies\Microsoft\Edge')) {
            $values = Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue
            $policies += [pscustomobject]@{
              Key=$key
              RemoteDebuggingAllowed=$values.RemoteDebuggingAllowed
              DeveloperToolsAvailability=$values.DeveloperToolsAvailability
            }
          }
          [ordered]@{
            Apps=@($apps | Select-Object ProcessId,ParentProcessId,CommandLine)
            WebViews=@($webviews | Select-Object ProcessId,ParentProcessId,CommandLine)
            Listeners=$listeners
            Policies=$policies
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $OutputPath -Encoding utf8
          '@
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          Set-Content -LiteralPath $probeFile -Value $probeSource -Encoding utf8
          $probe = $null
          $policyRestore = $null
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $policyName = 'zhiliao-studio.exe'
          $isElevated = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "Native test elevated: $isElevated"
          $nativeExit = 1
          try {
            if ($isElevated) {
              New-Item -Path $policyPath -Force | Out-Null
              $policyKey = Get-Item -LiteralPath $policyPath
              $existed = $policyKey.GetValueNames() -contains $policyName
              $policyRestore = @{
                Existed=$existed
                Value=$policyKey.GetValue($policyName)
                Kind=$(if ($existed) { $policyKey.GetValueKind($policyName).ToString() } else { 'String' })
              }
              New-ItemProperty -LiteralPath $policyPath -Name $policyName -Value '--remote-debugging-port=9236' -PropertyType String -Force | Out-Null
            }
            $probe = Start-Process pwsh -ArgumentList @('-NoProfile','-File',"`"$probeFile`"",'-OutputPath',"`"$probeOutput`"") -WindowStyle Hidden -PassThru
            npm run test:native
            $nativeExit = $LASTEXITCODE
          } finally {
            if ($probe -and -not $probe.WaitForExit(10000)) { Stop-Process -Id $probe.Id -Force }
            if (Test-Path -LiteralPath $probeOutput) { Get-Content -LiteralPath $probeOutput }
            if ($policyRestore) {
              if ($policyRestore.Existed) {
                New-ItemProperty -LiteralPath $policyPath -Name $policyName -Value $policyRestore.Value -PropertyType $policyRestore.Kind -Force | Out-Null
              } else {
                Remove-ItemProperty -LiteralPath $policyPath -Name $policyName -ErrorAction Stop
              }
            }
          }
          exit $nativeExit
      - name: Linux packaged app smoke test
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --locked --version 2.1.0
          xvfb-run -a dbus-run-session -- node scripts/linux-native-smoke.mjs
      - run: npm run package:release
      - name: Record build provenance
        run: node scripts/build-provenance.mjs
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.platform }}
          path: test-results/

  publish:
    name: Publish verified artifacts
    needs: [source, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify all artifact checksums
        run: node scripts/verify-release.mjs --all-platforms
      - name: Publish
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "CICADA-1 $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
